<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart visualizer</title>
<style>
:root{--bg:#14121a;--panel:#1d1a26;--fg:#ece9f4;--mut:#9c98aa;--line:#34304400;--ln:#2f2b3b;--acc:#46bff0;--bad:#ff9a5c;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:14px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body.drag{outline:3px dashed var(--acc);outline-offset:-10px}
#top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--ln)}
h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
#meta{color:var(--mut);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{position:relative;padding:7px 13px;border:1.5px solid var(--fg);border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--fg);color:var(--bg)}
.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.btn.on{border-color:#58d46f;color:#58d46f}
.btn.on:hover{background:#58d46f;color:var(--bg)}
.btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.slot{display:inline-flex;gap:4px;align-items:stretch}
.x{font:inherit;font-size:16px;font-weight:700;color:var(--fg);background:none;border:1.5px solid var(--fg);border-radius:6px;padding:0 10px;cursor:pointer}
.x:hover{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.x:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.x[hidden]{display:none}
#status{width:100%;font-size:13px;color:var(--mut);min-height:18px}
#status.err{color:var(--bad)}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cv:active{cursor:grabbing}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mut);pointer-events:none}
#empty[hidden]{display:none}
#empty b{display:block;color:var(--fg);font-size:22px;margin-bottom:6px}
#bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;padding:10px 18px;border-top:1px solid var(--ln);background:var(--panel)}
#bar button{font:inherit;font-weight:600;color:var(--fg);background:none;border:1.5px solid var(--fg);border-radius:6px;padding:6px 14px;cursor:pointer;min-width:74px}
#bar button:hover:not(:disabled){background:var(--fg);color:var(--bg)}
#bar button:disabled{opacity:.4;cursor:default}
#bar button:focus-visible,#bar input:focus-visible,#bar select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#time{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;min-width:112px}
#bpm{color:var(--mut);font-variant-numeric:tabular-nums;min-width:74px}
.grp{display:flex;align-items:center;gap:6px;white-space:nowrap}
#secn,.num{width:62px;background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:4px;padding:4px 6px;font:inherit}
#bar .num{width:58px}
.fld{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
.fld .num{width:80px}
.sbtn{font:inherit;font-size:13px;font-weight:600;color:var(--fg);background:none;border:1.5px solid var(--fg);border-radius:6px;padding:6px 13px;cursor:pointer}
.sbtn:hover:not(:disabled){background:var(--fg);color:var(--bg)}
.sbtn:disabled{opacity:.4;cursor:default}
.sbtn:focus-visible,.num:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#bar select{background:var(--bg);color:var(--fg);border:1px solid var(--ln);border-radius:4px;padding:4px;font:inherit}
#bar label{color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
#bar input[type=range]{accent-color:var(--acc)}
#seek{flex:1 1 220px;min-width:160px}
.vol{width:84px}
</style>
</head>
<body>
<header id="top">
  <div><h1 id="ttl">Chart visualizer</h1><div id="meta">Load a Psych Engine chart (.json). Audio is optional.</div></div>
  <div class="btns">
    <span class="slot"><label class="btn" id="bc"><span id="tc">Chart (.json)</span><input type="file" id="fc" accept=".json,application/json"></label><button class="x" id="xc" hidden aria-label="Remove chart" title="Remove chart">×</button></span>
    <span class="slot"><label class="btn" id="bi"><span id="ti">Instrumental</span><input type="file" id="fi" accept="audio/*"></label><button class="x" id="xi" hidden aria-label="Remove instrumental" title="Remove instrumental">×</button></span>
    <span class="slot"><label class="btn" id="bv"><span id="tv">Voices</span><input type="file" id="fv" accept="audio/*"></label><button class="x" id="xv" hidden aria-label="Remove voices" title="Remove voices">×</button></span>
  </div>
  <div class="btns">
    <label class="fld" title="Starting BPM. Notes keep their timestamps; only the beat and section grid changes.">BPM <input class="num" type="number" id="bpmIn" min="1" max="2000" step="any" disabled></label>
    <label class="fld">Note speed <input class="num" type="number" id="spdIn" min="0.1" max="20" step="0.1" disabled></label>
    <button class="sbtn" id="save" disabled>Save JSON</button>
    <button class="sbtn" id="reset" disabled>Reset</button>
  </div>
  <div id="status" role="status"></div>
</header>
<div id="stage">
  <canvas id="cv" aria-label="Chart notes"></canvas>
  <div id="empty"><div><b>No chart loaded</b>Drop a chart .json here, plus optional instrumental and voices audio files.<br>Files with “voice” in the name are used as voices.</div></div>
</div>
<footer id="bar">
  <button id="play" disabled>Play</button>
  <div class="grp"><button id="prev" disabled aria-label="Previous section" style="min-width:0;padding:6px 10px">‹</button>section <input id="secn" type="number" min="0" value="0" disabled> / <span id="sect">0</span><button id="next" disabled aria-label="Next section" style="min-width:0;padding:6px 10px">›</button></div>
  <div id="time">00:00.00</div><div id="bpm">0 BPM</div>
  <input type="range" id="seek" min="0" max="1" step="1" value="0" disabled aria-label="Position">
  <label>Speed <select id="rate"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
  <label>Zoom <input type="range" id="zoom" min="0.1" max="2" step="0.01" value="0.5"><input class="num" type="number" id="zoomN" min="10" max="500" value="100" aria-label="Zoom percent">%</label>
  <label>Main <input class="vol" type="range" id="vm" min="0" max="1" step="0.01" value="1"><input class="num" type="number" id="vmN" min="0" max="100" value="100" aria-label="Main volume percent">%</label>
  <label>Instrumental <input class="vol" type="range" id="vi" min="0" max="1" step="0.01" value="1"><input class="num" type="number" id="viN" min="0" max="100" value="100" aria-label="Instrumental volume percent">%</label>
  <label>Voices <input class="vol" type="range" id="vv" min="0" max="1" step="0.01" value="1"><input class="num" type="number" id="vvN" min="0" max="100" value="100" aria-label="Voices volume percent">%</label>
  <label><input type="checkbox" id="dupchk" checked> Mark stacked duplicates</label>
</footer>
<script>
const $=s=>document.querySelector(s);
const COL=['#c24b99','#1fd0f2','#12fa05','#f9393f'],ROT=[0,-Math.PI/2,Math.PI/2,Math.PI];
const NAMES=['Left','Down','Up','Right'];
const cv=$('#cv'),ctx=cv.getContext('2d');
let chart=null,cur=0,playing=false,dirty=true,zoom=.5,rate=1,base=0,pt0=0,useClock=true,dpr=1;
const T={inst:null,voices:null},vol={main:1,inst:1,voices:1};
let actx=null;

const tf=ms=>{ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=(ms%60000)/1000;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')};
const say=(t,err)=>{const s=$('#status');s.textContent=t;s.className=err?'err':''};
const lb=(arr,f,k)=>{let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;f(arr[m])<k?lo=m+1:hi=m}return lo};

function parse(d){
  const S=(d.song&&typeof d.song==='object')?d.song:d;
  const name=typeof d.song==='string'?d.song:(S.song||'Untitled');
  if(!Array.isArray(S.notes)||!S.notes.length)throw new Error('No "notes" sections found. This does not look like a Psych Engine chart.');
  let bpm=+S.bpm||120,t0=0;const secs=[],map=new Map();let dups=0;
  S.notes.forEach((sec,i)=>{
    const beats=+sec.sectionBeats||(sec.lengthInSteps?sec.lengthInSteps/4:4);
    if(sec.changeBPM&&+sec.bpm)bpm=+sec.bpm;
    const beat=60000/bpm,len=beats*beat,mh=!!sec.mustHitSection;
    secs.push({i,start:t0,len,bpm,beats,beat,change:!!sec.changeBPM});
    (sec.sectionNotes||[]).forEach(n=>{
      const t=+n[0],lane=+n[1];if(isNaN(t)||!(lane>=0&&lane<=7))return;
      const k=Math.round(t)+'|'+lane,e=map.get(k);
      if(e){e.dup++;dups++;return}
      map.set(k,{t,lane:lane%4,col:(((lane<4)===mh)?4:0)+lane%4,len:+n[2]||0,dup:1});
    });
    t0+=len;
  });
  const notes=[...map.values()].sort((a,b)=>a.t-b.t);
  const last=notes.length?Math.max(...notes.map(n=>n.t+n.len)):0;
  const c={name,raw:d,S,notes,dups,lastEnd:last,maxLen:Math.max(0,...notes.map(n=>n.len)),bpm0:+S.bpm||120,speed0:+S.speed||1};
  c.bpm=c.bpm0;c.speed=c.speed0;layout(c);return c;
}
/* Rebuilds only the beat/section grid from the current BPM. Notes keep their timestamps. */
function layout(c){
  let bpm=c.bpm,t0=0;
  c.secs=c.S.notes.map((sec,i)=>{
    const beats=+sec.sectionBeats||(sec.lengthInSteps?sec.lengthInSteps/4:4);
    if(sec.changeBPM&&+sec.bpm)bpm=+sec.bpm;
    const beat=60000/bpm,len=beats*beat,s={i,start:t0,len,bpm,beats,beat,change:!!sec.changeBPM};t0+=len;return s;
  });
  c.end=Math.max(t0,c.lastEnd+1000);
}
function chartUi(){
  const c=chart,ed=c.bpm!==c.bpm0||c.speed!==c.speed0;
  $('#meta').textContent=`${+c.bpm.toFixed(3)} BPM, speed ${c.speed}, ${c.secs.length} sections, ${c.notes.length.toLocaleString()} notes${c.dups?`, ${c.dups} stacked duplicates hidden`:''}${ed?'. Edited, not saved yet':''}`;
  $('#sect').textContent=c.secs.length-1;$('#secn').max=c.secs.length-1;$('#seek').max=Math.round(c.end);dirty=true;
}
function save(){
  if(!chart)return;
  const out=JSON.parse(JSON.stringify(chart.raw)),S=(out.song&&typeof out.song==='object')?out.song:out;
  if(chart.bpm!==chart.bpm0){S.bpm=chart.bpm;let b=chart.bpm;S.notes.forEach(sec=>{if(sec.changeBPM&&+sec.bpm)b=+sec.bpm;else sec.bpm=b})}
  if(chart.speed!==chart.speed0)S.speed=chart.speed;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
  a.download=chart.file||'chart.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  say(`Saved ${a.download}. Notes were not changed.`);
}

function curSec(){return Math.max(0,lb(chart.secs,s=>s.start,cur+.5)-1)}

/* ---------- audio ---------- */
function master(){return (T.inst||T.voices||{}).audio||null}
function applyVol(){for(const k of['inst','voices'])if(T[k])T[k].audio.volume=Math.min(1,vol.main*vol[k])}
async function loadAudio(file,kind){
  if(T[kind]){T[kind].audio.pause();URL.revokeObjectURL(T[kind].url)}
  const url=URL.createObjectURL(file),audio=new Audio(url);audio.preload='auto';audio.preservesPitch=true;audio.playbackRate=rate;
  audio.addEventListener('ended',()=>{if(playing&&master()===audio){base=cur;pt0=performance.now();useClock=true}});
  const tr=T[kind]={audio,url,peaks:null,max:1,name:file.name};
  slotOn(kind==='inst'?'i':'v',true);
  applyVol();if(playing){audio.currentTime=cur/1000;audio.play().catch(()=>{})}else audio.currentTime=cur/1000;
  say(`Decoding ${file.name} for the waveform…`);
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const buf=await actx.decodeAudioData(await file.arrayBuffer());
    const chs=[...Array(buf.numberOfChannels)].map((_,c)=>buf.getChannelData(c)),bs=Math.max(1,Math.round(buf.sampleRate*.005));
    const n=Math.ceil(buf.length/bs),p=new Float32Array(n);let mx=0;
    for(let i=0;i<n;i++){let m=0;const e=Math.min(buf.length,(i+1)*bs);for(const d of chs)for(let j=i*bs;j<e;j+=3){const v=Math.abs(d[j]);if(v>m)m=v}p[i]=m;if(m>mx)mx=m}
    tr.peaks=p;tr.max=mx||1;say(`${file.name} loaded.`);
  }catch(e){say(`${file.name}: the waveform could not be drawn, but playback may still work.`,true)}
  dirty=true;
}

/* ---------- transport ---------- */
function time(){const m=master();if(m&&!useClock)return m.currentTime*1000;return base+(performance.now()-pt0)*rate}
function seek(t){
  if(!chart)return;cur=Math.max(0,Math.min(chart.end,t));
  for(const k of['inst','voices'])if(T[k])T[k].audio.currentTime=cur/1000;
  base=cur;pt0=performance.now();const m=master();
  useClock=!m||(isFinite(m.duration)&&cur/1000>=m.duration);dirty=true;
}
function play(){
  if(!chart||playing)return;if(cur>=chart.end-50)cur=0;
  playing=true;base=cur;pt0=performance.now();const m=master();useClock=!m;
  for(const k of['inst','voices'])if(T[k]){const a=T[k].audio;a.currentTime=cur/1000;a.playbackRate=rate;a.play().catch(()=>{})}
}
function pause(){if(!playing)return;cur=time();playing=false;for(const k of['inst','voices'])if(T[k])T[k].audio.pause();dirty=true}
const toggle=()=>playing?pause():play();
function jump(i){if(!chart)return;i=Math.max(0,Math.min(chart.secs.length-1,i|0));seek(chart.secs[i].start)}
function prevSec(){const i=curSec();jump(cur-chart.secs[i].start>250?i:i-1)}
function nextSec(){jump(curSec()+1)}

/* ---------- drawing ---------- */
function arrow(x,y,s,lane,fill,alpha){
  ctx.save();ctx.translate(x,y);ctx.rotate(ROT[lane]);ctx.globalAlpha=alpha;
  const h=s/2,q=s/4;ctx.beginPath();ctx.moveTo(-h,0);ctx.lineTo(0,-h);ctx.lineTo(0,-q);ctx.lineTo(h,-q);ctx.lineTo(h,q);ctx.lineTo(0,q);ctx.lineTo(0,h);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  ctx.lineWidth=2;ctx.lineJoin='round';ctx.strokeStyle=fill?'rgba(0,0,0,.65)':'rgba(255,255,255,.35)';ctx.stroke();ctx.restore();
}
function wave(tr,x,w,HD,H,playY,color){
  ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(x,HD,w,H-HD);
  if(!tr||!tr.peaks)return;ctx.fillStyle=color;const p=tr.peaks;
  for(let y=HD;y<H;y++){const t=cur+(y-playY)/zoom;if(t<0)continue;const v=p[Math.floor(t/5)];if(v===undefined)continue;const hw=v/tr.max*w*.48;ctx.fillRect(x+w/2-hw,y,hw*2,1)}
}
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  if(!chart)return;
  const HD=34,playY=HD+(H-HD)*.2,LW=54,wfW=84,gap=14,SEP=96,gridW=LW*8+SEP;
  const x0=Math.max(8,(W-(wfW*2+gap*2+gridW+70))/2),gx=x0+wfW*2+gap*2,gr=gx+gridW;
  const colX=c=>gx+c*LW+(c>=4?SEP:0);
  const tAt=y=>cur+(y-playY)/zoom,yAt=t=>playY+(t-cur)*zoom,tmin=tAt(HD),tmax=tAt(H);
  ctx.font='600 12px "Avenir Next","Segoe UI",system-ui,sans-serif';ctx.textAlign='center';ctx.fillStyle='#9c98aa';
  ctx.fillText('Instrumental',x0+wfW/2,22);ctx.fillText('Voices',x0+wfW+gap+wfW/2,22);
  ctx.fillText('Opponent',gx+LW*2,22);ctx.fillText('Player',colX(4)+LW*2,22);
  ctx.save();ctx.beginPath();ctx.rect(0,HD,W,H-HD);ctx.clip();
  wave(T.inst,x0,wfW,HD,H,playY,'#5b8def');wave(T.voices,x0+wfW+gap,wfW,HD,H,playY,'#f0a04b');
  for(let c=0;c<8;c++){ctx.fillStyle=c%2?'rgba(255,255,255,.015)':'rgba(255,255,255,.045)';ctx.fillRect(colX(c),HD,LW,H-HD)}
  ctx.fillStyle='rgba(255,255,255,.12)';for(let c=0;c<8;c++){ctx.fillRect(colX(c),HD,1,H-HD);if(c===3||c===7)ctx.fillRect(colX(c)+LW,HD,1,H-HD)}
  const S=chart.secs,s0=Math.max(0,lb(S,s=>s.start,tmin)-1),curI=curSec();ctx.textAlign='left';
  for(let i=s0;i<S.length&&S[i].start<=tmax;i++){const s=S[i];
    for(let b=1;b<s.beats;b++){const y=Math.round(yAt(s.start+b*s.beat))+.5;ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(gx,y,LW*4,1);ctx.fillRect(colX(4),y,LW*4,1)}
    const y=Math.round(yAt(s.start));ctx.fillStyle=i===curI?'#46bff0':'rgba(255,255,255,.45)';ctx.fillRect(x0,y,gr-x0,i===curI?2:1);
    ctx.fillText(s.change?`${i}  ${+s.bpm.toFixed(1)} BPM`:String(i),gr+10,y+14);
  }
  const lit=Array(8).fill(0),showDup=$('#dupchk').checked,N=chart.notes;
  for(let i=Math.max(0,lb(N,n=>n.t,tmin-chart.maxLen-60));i<N.length&&N[i].t<=tmax+60;i++){
    const n=N[i],cx=colX(n.col)+LW/2,y=yAt(n.t);
    if(n.len>0){const h=n.len*zoom;ctx.globalAlpha=n.t+n.len<cur?.25:.55;ctx.fillStyle=COL[n.lane];ctx.fillRect(cx-6,y,12,h);ctx.globalAlpha=1}
    const past=n.t<cur-25;
    if(n.t<=cur&&cur-n.t<140)lit[n.col]=Math.max(lit[n.col],1-(cur-n.t)/140);
    arrow(cx,y,40,n.lane,COL[n.lane],past?.4:1);
    if(showDup&&n.dup>1){ctx.beginPath();ctx.arc(cx+17,y-17,8,0,7);ctx.fillStyle='#ff9a5c';ctx.fill();ctx.fillStyle='#14121a';ctx.textAlign='center';ctx.font='700 10px system-ui,sans-serif';ctx.fillText(n.dup,cx+17,y-13.5);ctx.textAlign='left'}
  }
  for(let c=0;c<8;c++){const cx=colX(c)+LW/2,l=lit[c];arrow(cx,playY,40*(1+l*.12),c%4,l>0?COL[c%4]:null,l>0?.35+.65*l:.8)}
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(x0,Math.round(playY)-1,gr-x0,1);
  ctx.restore();
}

/* ---------- HUD + loop ---------- */
function hud(){
  const i=curSec();$('#time').textContent=tf(cur);$('#bpm').textContent=+chart.secs[i].bpm.toFixed(2)+' BPM';
  if(document.activeElement!==$('#secn'))$('#secn').value=i;
  $('#seek').value=cur;$('#play').textContent=playing?'Pause':'Play';
}
let lastSync=0;
function frame(now){
  if(chart){
    if(playing){cur=time();if(cur>=chart.end){cur=chart.end;pause()}
      if(now-lastSync>400){lastSync=now;const m=master();for(const k of['inst','voices']){const a=T[k]&&T[k].audio;if(a&&a!==m&&!useClock&&Math.abs(a.currentTime-cur/1000)>.07)a.currentTime=cur/1000}}}
    if(playing||dirty){draw();hud();dirty=false}
  }
  requestAnimationFrame(frame);
}
function size(){dpr=devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;dirty=true}
new ResizeObserver(size).observe($('#stage'));size();requestAnimationFrame(frame);

/* ---------- loading ---------- */
function loadChart(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const c=parse(JSON.parse(fr.result));pause();chart=c;cur=0;
    c.file=file.name;$('#ttl').textContent=c.name;chartUi();
    $('#bpmIn').value=c.bpm;$('#spdIn').value=c.speed;
    $('#empty').hidden=true;slotOn('c',true);
    for(const id of['play','prev','next','secn','seek','bpmIn','spdIn','save','reset'])$('#'+id).disabled=false;
    say(`${file.name} loaded. ${master()?'':'No audio loaded, so playback is silent.'}`);dirty=true;
  }catch(e){say(e instanceof SyntaxError?'This file is not valid JSON.':e.message,true)}};
  fr.onerror=()=>say('The file could not be read.',true);fr.readAsText(file);
}
const LBL={c:['Chart (.json)','Replace chart'],i:['Instrumental','Replace instrumental'],v:['Voices','Replace voices']};
function slotOn(k,on){$('#b'+k).classList.toggle('on',on);$('#t'+k).textContent=LBL[k][on?1:0];$('#x'+k).hidden=!on}
const okDiscard=()=>!chart||(chart.bpm===chart.bpm0&&chart.speed===chart.speed0)||confirm('Discard your unsaved BPM and note speed edits?');
function removeAudio(kind){
  const tr=T[kind];if(!tr)return;const was=playing;pause();
  tr.audio.pause();tr.audio.removeAttribute('src');tr.audio.load();URL.revokeObjectURL(tr.url);T[kind]=null;
  slotOn(kind==='inst'?'i':'v',false);
  say(`${tr.name} removed.${master()?'':' No audio loaded, so playback is silent.'}`);dirty=true;if(was)play();
}
function removeChart(){
  if(!chart||!okDiscard())return;pause();chart=null;cur=0;
  $('#ttl').textContent='Chart visualizer';$('#meta').textContent='Load a Psych Engine chart (.json). Audio is optional.';
  $('#empty').hidden=false;slotOn('c',false);
  for(const id of['play','prev','next','secn','seek','bpmIn','spdIn','save','reset'])$('#'+id).disabled=true;
  $('#time').textContent='00:00.00';$('#bpm').textContent='0 BPM';$('#secn').value=0;$('#sect').textContent=0;$('#seek').value=0;
  $('#play').textContent='Play';$('#bpmIn').value='';$('#spdIn').value='';
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);say('Chart removed.');
}
function route(f){
  if(!f)return;
  if(/\.json$/i.test(f.name)||f.type==='application/json'){if(okDiscard())loadChart(f)}
  else if(/^audio\//.test(f.type)||/\.(ogg|mp3|wav|flac|m4a|aac|opus)$/i.test(f.name))loadAudio(f,/voice/i.test(f.name)?'voices':'inst');
  else say(`${f.name} is not a chart .json or an audio file.`,true);
}
$('#fc').onchange=e=>{route(e.target.files[0]);e.target.value=''};
$('#fi').onchange=e=>{if(e.target.files[0])loadAudio(e.target.files[0],'inst');e.target.value=''};
$('#fv').onchange=e=>{if(e.target.files[0])loadAudio(e.target.files[0],'voices');e.target.value=''};
$('#xc').onclick=removeChart;$('#xi').onclick=()=>removeAudio('inst');$('#xv').onclick=()=>removeAudio('voices');
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('drag')});
addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('drag')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('drag');[...e.dataTransfer.files].forEach(route)});

/* ---------- controls ---------- */
$('#play').onclick=toggle;$('#prev').onclick=prevSec;$('#next').onclick=nextSec;
$('#secn').onchange=e=>jump(+e.target.value);
$('#seek').oninput=e=>seek(+e.target.value);
$('#rate').onchange=e=>{rate=+e.target.value;if(playing){base=time();pt0=performance.now()}for(const k of['inst','voices'])if(T[k])T[k].audio.playbackRate=rate};
function setZoom(z,skipNum){zoom=Math.max(.05,Math.min(2.5,z));$('#zoom').value=zoom;if(!skipNum)$('#zoomN').value=Math.round(zoom/.5*100);dirty=true}
$('#zoom').oninput=e=>setZoom(+e.target.value);
$('#zoomN').oninput=e=>{const v=parseFloat(e.target.value);if(v>=10&&v<=500)setZoom(v/100*.5,true)};
$('#zoomN').onchange=()=>setZoom(zoom);
$('#dupchk').onchange=()=>dirty=true;
const VK={vm:'main',vi:'inst',vv:'voices'};
function setVol(id,p,skipNum){p=Math.max(0,Math.min(100,p));vol[VK[id]]=p/100;$('#'+id).value=p/100;if(!skipNum)$('#'+id+'N').value=Math.round(p);applyVol()}
for(const id in VK){
  $('#'+id).oninput=e=>setVol(id,e.target.value*100);
  $('#'+id+'N').oninput=e=>{const v=parseFloat(e.target.value);if(!isNaN(v))setVol(id,v,true)};
  $('#'+id+'N').onchange=()=>setVol(id,vol[VK[id]]*100);
}
$('#bpmIn').oninput=e=>{const v=+e.target.value;if(chart&&v>=1&&v<=2000){chart.bpm=v;layout(chart);cur=Math.min(cur,chart.end);chartUi()}};
$('#bpmIn').onchange=()=>{if(chart)$('#bpmIn').value=chart.bpm};
$('#spdIn').oninput=e=>{const v=+e.target.value;if(chart&&v>=.1&&v<=20){chart.speed=v;chartUi()}};
$('#spdIn').onchange=()=>{if(chart)$('#spdIn').value=chart.speed};
$('#reset').onclick=()=>{if(!chart)return;chart.bpm=chart.bpm0;chart.speed=chart.speed0;layout(chart);$('#bpmIn').value=chart.bpm;$('#spdIn').value=chart.speed;chartUi()};
$('#save').onclick=save;
cv.addEventListener('wheel',e=>{e.preventDefault();if(!chart)return;
  if(e.ctrlKey)setZoom(zoom*(e.deltaY>0?.92:1.08))
  else seek((playing?time():cur)+e.deltaY/zoom*.6)},{passive:false});
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!chart)return;cv.setPointerCapture(e.pointerId);drag={y:e.clientY,was:playing};pause()});
cv.addEventListener('pointermove',e=>{if(!drag)return;seek(cur-(e.clientY-drag.y)/zoom);drag.y=e.clientY});
const endDrag=()=>{if(drag&&drag.was)play();drag=null};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{
  if(!chart||e.target.matches('input[type=number],select'))return;
  const k=e.code;if(k==='Space'&&e.target.matches('.sbtn'))return;
  if(k==='Space'){e.preventDefault();toggle()}
  else if(k==='ArrowRight'){e.preventDefault();nextSec()}
  else if(k==='ArrowLeft'){e.preventDefault();prevSec()}
  else if(k==='ArrowDown'){e.preventDefault();seek(cur+250)}
  else if(k==='ArrowUp'){e.preventDefault();seek(cur-250)}
});
</script>
</body>
</html>
